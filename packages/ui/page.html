<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory X</title>
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --border: #e7e5e4; --text: #1c1917;
    --dim: #78716c; --accent: #0369a1; --accent-bg: #f0f9ff;
    --add: #15803d; --add-bg: #f0fdf4; --del: #b91c1c; --del-bg: #fef2f2;
    --warn: #b45309; --info: #475569;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.6 ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 20px;
           background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; font-weight: 600; }
  header .stats { color: var(--dim); font-size: 12px; }
  header .rev { margin-left: auto; font-size: 12px; color: var(--dim); }
  main { flex: 1; display: flex; min-height: 0; }
  #side { width: 320px; border-right: 1px solid var(--border); background: var(--panel);
          display: flex; flex-direction: column; min-height: 0; }
  #searchbar { padding: 10px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
  #searchbar input { flex: 1; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font: inherit; }
  #treebar { display: flex; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .toolbtn { flex: 1; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
             background: var(--panel); color: var(--text); font: inherit; font-size: 12px; cursor: pointer; }
  .toolbtn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  #tree { flex: 1; overflow: auto; padding: 8px; }
  .node { user-select: none; }
  .node .row { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px;
               cursor: pointer; white-space: nowrap; }
  .node .row:hover { background: var(--accent-bg); }
  .node .row.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .node .caret { width: 14px; color: var(--dim); font-size: 10px; flex: none; cursor: pointer; text-align: center; }
  .node .count { color: var(--dim); font-size: 11px; }
  .node .diamond { color: var(--accent); font-size: 11px; }
  #content { flex: 1; overflow: auto; padding: 20px 24px; min-width: 0; }
  .view { display: none; } .view.on { display: block; }
  .crumb { color: var(--dim); font-size: 12px; margin-bottom: 8px; word-break: break-all; }
  .crumb b { color: var(--accent); }
  h2.nd-title { font-size: 18px; margin-bottom: 12px; }
  ul.leaves { list-style: none; margin: 0 0 16px; }
  ul.leaves li { padding: 4px 0 4px 14px; margin-left: 2px; }
  .content-block { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
                   padding: 14px 16px; white-space: pre-wrap; font: 13px/1.7 ui-monospace, monospace; }
  /* Markdown 渲染 */
  .content-block.md { white-space: normal; font: 14px/1.7 ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 16px 0 8px; line-height: 1.3; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; }
  .md h4, .md h5, .md h6 { font-size: 14px; color: var(--dim); }
  .md p { margin: 0 0 10px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 24px; }
  .md li { margin: 2px 0; }
  .md a { color: var(--accent); }
  .md code { background: #f1f0ef; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px;
             font: 12px/1.5 ui-monospace, monospace; }
  .md pre.md-code { background: #f8f7f6; border: 1px solid var(--border); border-radius: 8px;
                    padding: 10px 12px; overflow: auto; margin: 0 0 10px; }
  .md pre.md-code code { background: none; border: 0; padding: 0; font-size: 12.5px; }
  .md blockquote { margin: 0 0 10px; padding: 2px 12px; border-left: 3px solid var(--border); color: var(--dim); }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
  .md table { border-collapse: collapse; margin: 0 0 10px; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; }
  .md th { background: var(--accent-bg); }
  .md img { max-width: 100%; }
  .md .mermaid { margin: 0 0 10px; text-align: center; }
  .section-title { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 8px; }
  .hit { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px;
         background: var(--panel); cursor: pointer; }
  .hit:hover { border-color: var(--accent); }
  .hit .chain { font-size: 12px; color: var(--accent); margin-bottom: 4px; }
  .hit .snip { font-size: 13px; color: var(--text); }
  .hit .meta { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .rev-item { display: flex; gap: 10px; padding: 8px 12px; border: 1px solid var(--border);
              border-radius: 8px; margin-bottom: 8px; background: var(--panel); cursor: pointer; align-items: baseline; }
  .rev-item:hover { border-color: var(--accent); }
  .rev-item .id { font-family: ui-monospace, monospace; color: var(--accent); flex: none; }
  .rev-item .op { flex: none; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--accent-bg); color: var(--accent); }
  .rev-item .time { margin-left: auto; font-size: 11px; color: var(--dim); flex: none; }
  pre.diff { font: 12px/1.6 ui-monospace, monospace; background: var(--panel); border: 1px solid var(--border);
             border-radius: 8px; padding: 12px; overflow: auto; white-space: pre-wrap; }
  pre.diff .a { color: var(--add); background: var(--add-bg); display: block; }
  pre.diff .d { color: var(--del); background: var(--del-bg); display: block; }
  .issue { padding: 8px 12px; border-left: 3px solid var(--info); background: var(--panel);
           border-radius: 0 8px 8px 0; margin-bottom: 8px; }
  .issue.warn { border-left-color: var(--warn); }
  .issue .rule { font-size: 11px; color: var(--dim); }
  .empty { color: var(--dim); padding: 20px; text-align: center; }
  mark { background: #fde68a; padding: 0 2px; border-radius: 2px; }
</style>
</head>
<body>
<header>
  <h1>🧠 Memory X</h1>
  <span class="stats" id="stats"></span>
  <span class="rev" id="rev"></span>
</header>
<main>
  <div id="side">
    <div id="searchbar">
      <input id="q" placeholder="搜索记忆…（回车）">
    </div>
    <div id="treebar">
      <button id="expand-all" class="toolbtn" title="展开全部节点">展开全部</button>
      <button id="collapse-all" class="toolbtn" title="折叠全部节点">折叠全部</button>
    </div>
    <div id="tree"></div>
  </div>
  <div id="content">
    <div class="view on" id="v-node"></div>
    <div class="view" id="v-search"></div>
    <div class="view" id="v-history"></div>
    <div class="view" id="v-lint"></div>
  </div>
</main>
<script type="module">
const $ = (s) => document.querySelector(s);
let TREE = [];
let lastRev = -1;

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error((await r.json()).error ?? r.status);
  return r.json();
}

// ---------- URL 状态持久化 ----------
// #open=<JSON 路径数组>&node=<路径>：刷新/分享链接后保留展开态与当前节点
let ACTIVE = null;
const urlParams = () => new URLSearchParams(location.hash.replace(/^#/, ""));
function readExpanded() {
  try {
    const raw = urlParams().get("open");
    if (raw) return new Set(JSON.parse(raw));
  } catch {}
  return new Set();
}
const expanded = readExpanded();
function saveUrlState() {
  const p = new URLSearchParams();
  if (expanded.size) p.set("open", JSON.stringify([...expanded]));
  if (ACTIVE) p.set("node", ACTIVE);
  const s = p.toString();
  history.replaceState(null, "", s ? `#${s}` : location.pathname + location.search);
}
// 累积祖先路径（不含自身）
const ancestors = (p) => p.split("/").slice(0, -1).map((_, i, a) => a.slice(0, i + 1).join("/"));

// ---------- Markdown 渲染（无依赖子集） ----------
// 先 escape，再只生成自有标签；不解析原始 HTML，避免记忆文本注入。
function safeUrl(u) {
  u = String(u ?? "").trim();
  if (/^(https?:|mailto:|data:image\/)/i.test(u)) return u;
  if (u.startsWith("#") || u.startsWith("/") || u.startsWith(".")) return u; // 锚点 / 相对路径
  return "#";
}
function inlineMd(text) {
  const stash = [];
  const keep = (html) => { stash.push(html); return `\u0000${stash.length - 1}\u0000`; };
  let t = String(text ?? "");
  t = t.replace(/`([^`]+)`/g, (_, c) => keep(`<code>${esc(c)}</code>`));
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, src) => keep(`<img alt="${esc(alt)}" src="${esc(safeUrl(src))}">`));
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g,
    (_, txt, href) => keep(`<a href="${esc(safeUrl(href))}" target="_blank" rel="noopener noreferrer">${inlineMd(txt)}</a>`));
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<>()]+)/g,
    (m, pre, u) => pre + keep(`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`));
  t = esc(t);
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  t = t.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  t = t.replace(/\u0000(\d+)\u0000/g, (_, i) => stash[+i]);
  return t;
}
function parseList(lines, start, baseIndent) {
  const ordered = /^\s*\d+[.)]\s+/.test(lines[start]);
  const tag = ordered ? "ol" : "ul";
  const n = lines.length;
  const indentOf = (l) => l.match(/^\s*/)[0].length;
  const itemRe = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  let html = `<${tag}>`, i = start;
  while (i < n) {
    const line = lines[i];
    if (line.trim() === "") {
      let j = i + 1;
      while (j < n && lines[j].trim() === "") j++;
      if (j < n && indentOf(lines[j]) >= baseIndent && itemRe.test(lines[j])) { i = j; continue; }
      break;
    }
    const m = line.match(itemRe);
    if (!m) break;
    const indent = m[1].length;
    if (indent < baseIndent) break;
    if (indent > baseIndent) { // 嵌套在上一项下
      const [sub, ni] = parseList(lines, i, indent);
      html = html.replace(/<\/li>$/, sub + "</li>");
      i = ni; continue;
    }
    let content = m[3], cb = "";
    const tm = content.match(/^\[([ xX])\]\s+(.*)$/);
    if (tm) { cb = `<input type="checkbox" disabled${tm[1].toLowerCase() === "x" ? " checked" : ""}> `; content = tm[2]; }
    i++;
    const sub = [];
    while (i < n) {
      const l = lines[i];
      if (l.trim() === "") {
        let j = i + 1;
        while (j < n && lines[j].trim() === "") j++;
        if (j < n && indentOf(lines[j]) > indent) { sub.push(""); i++; continue; }
        break;
      }
      if (indentOf(l) > indent) { sub.push(l.slice(Math.min(indent + 2, indentOf(l)))); i++; continue; }
      if (itemRe.test(l)) break;
      sub.push(l.trim()); i++;
    }
    let inner = inlineMd(content);
    if (sub.length) {
      const looksBlock = /^\s*([-*+]|\d+[.)])\s|^\s*(`{3,}|~{3,})|^\s*#{1,6}\s|^\s*>/.test(sub[0]);
      inner += looksBlock ? renderMarkdown(sub.join("\n")) : "<br>" + sub.map((s) => s.trim()).filter(Boolean).map(inlineMd).join("<br>");
    }
    html += `<li>${cb}${inner}</li>`;
  }
  return [html + `</${tag}>`, i];
}
function renderMarkdown(src) {
  const lines = String(src ?? "").replace(/\r\n?/g, "\n").split("\n");
  const n = lines.length;
  const indentOf = (l) => l.match(/^\s*/)[0].length;
  const isItem = (l) => /^\s*([-*+]|\d+[.)])\s+/.test(l);
  let out = "", i = 0;
  const para = [];
  const flush = () => { if (para.length) { out += `<p>${para.map(inlineMd).join("<br>")}</p>`; para.length = 0; } };
  while (i < n) {
    const line = lines[i];
    if (line.trim() === "") { flush(); i++; continue; }
    const fence = line.match(/^\s*(`{3,}|~{3,})\s*([\w+#.-]*)\s*$/);
    if (fence) {
      flush();
      const marker = fence[1][0], lang = fence[2] || "";
      const closeRe = new RegExp("^\\s*" + marker + "{3,}\\s*$");
      const buf = []; i++;
      while (i < n && !closeRe.test(lines[i])) { buf.push(lines[i]); i++; }
      if (i < n) i++;
      const code = buf.join("\n");
      out += lang.toLowerCase() === "mermaid"
        ? `<div class="mermaid">${esc(code)}</div>`
        : `<pre class="md-code"><code${lang ? ` class="language-${esc(lang)}"` : ""}>${esc(code)}</code></pre>`;
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
    if (h) { flush(); const lv = h[1].length; out += `<h${lv}>${inlineMd(h[2])}</h${lv}>`; i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); out += "<hr>"; i++; continue; }
    if (/^\s*>/.test(line)) {
      flush();
      const buf = [];
      while (i < n && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out += `<blockquote>${renderMarkdown(buf.join("\n"))}</blockquote>`;
      continue;
    }
    if (line.includes("|") && i + 1 < n && /^[\s|:-]+$/.test(lines[i + 1]) && lines[i + 1].includes("-") && lines[i + 1].includes("|")) {
      flush();
      const cells = (l) => l.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map((c) => c.trim());
      const head = cells(line); i += 2;
      let body = "";
      while (i < n && lines[i].includes("|") && lines[i].trim() !== "") {
        body += "<tr>" + cells(lines[i]).map((c) => `<td>${inlineMd(c)}</td>`).join("") + "</tr>";
        i++;
      }
      out += `<table><thead><tr>${head.map((c) => `<th>${inlineMd(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`;
      continue;
    }
    if (isItem(line)) { flush(); const [html, ni] = parseList(lines, i, indentOf(line)); out += html; i = ni; continue; }
    para.push(line.trim()); i++;
  }
  flush();
  return out;
}
// mermaid：按需惰性加载（CDN）；失败则退化为源码块
let mermaidLib = null;
async function renderMermaid(root) {
  const nodes = [...root.querySelectorAll(".mermaid")];
  if (!nodes.length) return;
  try {
    if (!mermaidLib) {
      const mod = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
      mermaidLib = mod.default ?? mod;
      mermaidLib.initialize({ startOnLoad: false, securityLevel: "strict" });
    }
    await mermaidLib.run({ nodes });
  } catch {
    for (const el of nodes) {
      const pre = document.createElement("pre");
      pre.className = "md-code";
      const code = document.createElement("code");
      code.textContent = el.textContent;
      pre.appendChild(code);
      el.replaceWith(pre);
    }
  }
}

// ---------- 树 ----------
function renderTree() {
  const el = $("#tree");
  el.innerHTML = "";
  const frag = document.createDocumentFragment();
  const build = (nodes, depth, parent) => {
    for (const n of nodes) {
      const wrap = document.createElement("div");
      wrap.className = "node";
      const row = document.createElement("div");
      row.className = "row";
      row.style.paddingLeft = `${6 + depth * 14}px`;
      const hasKids = n.children.length > 0;
      const open = expanded.has(n.path);
      const caret = document.createElement("span");
      caret.className = "caret";
      caret.textContent = hasKids ? (open ? "▼" : "▶") : "·";
      // 只有点击箭头才切换展开/折叠（阻止冒泡，避免同时选中）
      caret.onclick = (e) => {
        if (!hasKids) return;
        e.stopPropagation();
        expanded.has(n.path) ? expanded.delete(n.path) : expanded.add(n.path);
        renderTree();
        saveUrlState();
      };
      const t = document.createElement("span"); t.className = "t"; t.textContent = n.title;
      row.append(caret, t);
      if (n.leafTotal > 0) { const c = document.createElement("span"); c.className = "count"; c.textContent = n.leafTotal; row.append(c); }
      if (n.hasContent) { const d = document.createElement("span"); d.className = "diamond"; d.textContent = "◆"; row.append(d); }
      if (n.path === ACTIVE) row.classList.add("active");
      // 点击行本身只选中节点，不影响展开态
      row.onclick = () => {
        showNode(n);
        renderTree();
        saveUrlState();
      };
      wrap.appendChild(row);
      if (hasKids && open) build(n.children, depth + 1, wrap);
      parent.appendChild(wrap);
    }
  };
  build(TREE, 0, frag);
  el.appendChild(frag);
}

function findByPath(path) {
  let found = null;
  const walk = (ns) => { for (const n of ns) { if (n.path === path) { found = n; return; } walk(n.children); } };
  walk(TREE);
  return found;
}

// 展开/折叠全部（一键）：收集所有含子节点的路径；同步写入 URL 展开态
function allParentPaths(nodes, acc = []) {
  for (const n of nodes) { if (n.children.length) { acc.push(n.path); allParentPaths(n.children, acc); } }
  return acc;
}
function expandAll() { for (const p of allParentPaths(TREE)) expanded.add(p); renderTree(); saveUrlState(); }
function collapseAll() { expanded.clear(); renderTree(); saveUrlState(); }

// ---------- 视图 ----------
function switchView(id) {
  document.querySelectorAll(".view").forEach((v) => v.classList.remove("on"));
  $(id).classList.add("on");
}

function showNode(n) {
  ACTIVE = n.path;
  switchView("#v-node");
  const segs = n.path.split("/");
  const crumb = segs.map((s, i) => (i === segs.length - 1 ? `<b>${esc(s)}</b>` : esc(s))).join(" › ");
  let html = `<div class="crumb">${crumb}</div><h2 class="nd-title">${esc(n.title)}</h2>`;
  if (n.leaves.length > 0) {
    html += `<ul class="leaves">` +
      n.leaves.map((l) => `<li>${inlineMd(l)}</li>`).join("") + "</ul>";
  }
  if (n.content != null) {
    html += `<div class="section-title">完整信息（content ◆）</div><div class="content-block md">${renderMarkdown(n.content)}</div>`;
  }
  if (n.leaves.length === 0 && n.content == null) {
    html += n.children.length > 0
      ? `<div class="empty">子节点见左侧目录（${n.children.length}）</div>`
      : `<div class="empty">（空节点）</div>`;
  }
  $("#v-node").innerHTML = html;
  renderMermaid($("#v-node"));
}

async function showSearch(q) {
  switchView("#v-search");
  $("#v-search").innerHTML = `<div class="empty">搜索中…</div>`;
  const { hits } = await api(`/api/search?q=${encodeURIComponent(q)}`);
  if (hits.length === 0) { $("#v-search").innerHTML = `<div class="empty">无命中：「${esc(q)}」</div>`; return; }
  $("#v-search").innerHTML = hits.map((h, i) => `
    <div class="hit" data-path="${esc(h.path)}">
      <div class="chain">${[...h.ancestors, h.title].map(esc).join(" › ")}</div>
      <div class="snip">${esc(h.snippet)}</div>
      <div class="meta">score ${h.score} · ${h.via}${h.hasContent ? " · 有完整信息" : ""}${h.leafCount ? ` · ${h.leafCount} 条事实` : ""}</div>
    </div>`).join("");
  $("#v-search").querySelectorAll(".hit").forEach((el) => {
    el.onclick = () => {
      const p = el.dataset.path;
      for (const seg of ancestors(p)) expanded.add(seg); // 展开祖先链
      expanded.add(p);
      const n = findByPath(p);
      if (n) showNode(n); // 重名消歧路径可能对不上树里的 title，此时退化为搜索态
      renderTree();
      saveUrlState();
    };
  });
}

async function showHistory() {
  switchView("#v-history");
  const { revisions } = await api("/api/revisions?limit=100");
  $("#v-history").innerHTML = revisions.map((r) => `
    <div class="rev-item" data-id="${r.id}">
      <span class="id">#${r.id}</span><span class="op">${esc(r.op)}</span>
      <span>${esc(r.path ?? "")}</span><span class="time">${r.created_at}</span>
    </div>`).join("") || `<div class="empty">暂无历史</div>`;
  $("#v-history").querySelectorAll(".rev-item").forEach((el) => {
    el.onclick = async () => {
      const d = await api(`/api/revisions/diff?id=${el.dataset.id}`);
      const box = document.createElement("pre");
      box.className = "diff";
      box.innerHTML = esc(d.diff).split("\n").map((line) => {
        if (line.startsWith("+ ")) return `<span class="a">${line}</span>`;
        if (line.startsWith("- ")) return `<span class="d">${line}</span>`;
        return line;
      }).join("\n");
      const item = el;
      document.querySelectorAll(".rev-item pre").forEach((x) => x.remove());
      item.after(box);
    };
  });
}

async function showLint() {
  switchView("#v-lint");
  const { issues } = await api("/api/lint");
  $("#v-lint").innerHTML = issues.length === 0
    ? `<div class="empty">结构健康 ✓（深度/广度/叶子/重名/时间性命名均达标）</div>`
    : issues.map((i) => `
      <div class="issue ${i.level}">
        <div><b>${esc(i.path || "(根)")}</b> <span class="rule">[${i.rule}]</span></div>
        <div>${esc(i.message)}</div>
      </div>`).join("");
}

// ---------- 顶栏动作 ----------
$("#stats").textContent = "";
$("#stats").style.cursor = "pointer";
$("#stats").title = "点击查看体检";
$("#stats").onclick = showLint;
$("#rev").textContent = "";
$("#rev").style.cursor = "pointer";
$("#rev").title = "点击查看版本历史";
$("#rev").onclick = showHistory;

$("#q").onkeydown = (e) => { if (e.key === "Enter" && e.target.value.trim()) showSearch(e.target.value.trim()); };
$("#expand-all").onclick = expandAll;
$("#collapse-all").onclick = collapseAll;

// ---------- 初始化 + 轮询 ----------
async function refresh() {
  const [treeD, stats, ping] = await Promise.all([api("/api/tree"), api("/api/stats"), api("/api/ping")]);
  TREE = treeD.tree;
  $("#stats").textContent = `${stats.nodes} 节点 · ${stats.leaves} 事实 · 深度 ${stats.depth}`;
  $("#rev").textContent = `版本 #${ping.latest}（点击看历史）`;
  const want = ACTIVE ?? urlParams().get("node");
  if (want && findByPath(want)) ACTIVE = want; // 恢复 URL 中的当前节点
  renderTree();
  if (!$("#v-node").innerHTML) {
    showNode(findByPath(ACTIVE) ?? TREE[0] ?? { title: "（空）", path: "", leaves: [], content: null, children: [] });
    saveUrlState();
  }
}
await refresh();
window.addEventListener("hashchange", () => {
  expanded.clear();
  for (const p of readExpanded()) expanded.add(p);
  renderTree();
});
setInterval(async () => {
  try {
    const ping = await api("/api/ping");
    if (ping.latest !== lastRev && lastRev !== -1) refresh();
    lastRev = ping.latest;
  } catch {}
}, 2000);

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
</script>
